name: Lint
on:
  push:
  pull_request:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: phplint, laravel/pint
          coverage: none
      - name: Check syntax
        run: phplint .
      - name: Check code style
        run: pint --test
